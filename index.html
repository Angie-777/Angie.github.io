<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZ 💕</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="examen-container">
        <!-- HEADER -->
        <div class="examen-header">
            <h1>⚡ QUIZZ POR TU PUMPE ⚡</h1>
        </div>

        <!-- MAIN CONTENT -->
        <div class="examen-wrapper">
            <!-- LEFT SIDE - DEFINICIONES -->
            <div class="definitions-section">
                <h2>📝 PREGUNTAS</h2>
                <div id="definitionsList" class="definitions-list"></div>
            </div>

            <!-- RIGHT SIDE - RESPUESTAS -->
            <div class="answers-section">
                <h2>🎯 RESPUESTAS</h2>
                <div id="answersList" class="answers-list"></div>
            </div>
        </div>

        <!-- BUTTONS -->
        <div class="examen-buttons">
            <button id="checkBtn" class="btn-check">✓ VERIFICAR</button>
            <button id="clearBtn" class="btn-clear">🗑️ LIMPIAR</button>
        </div>
    </div>

    <!-- SUCCESS MODAL -->
    <div id="successModal" class="success-modal">
        <div class="success-content">
            <h2>⚡ ¡LO HICISTE! ⚡</h2>
            <p>¡Me conoces mejor que a nadie! 💕</p>
            <p class="time-text">⏱️ Tiempo: <span id="timeSpent">0:00</span></p>
            <p>Redirigiendo en 3 segundos...</p>
        </div>
    </div>

<div id="notificationModal" class="notification-modal">
    <div class="notification-content">
        <p id="notificationMessage"></p>
        <button id="closeNotificationBtn" class="btn-close">✖️ CERRAR</button>
    </div>
</div>

    <script src="index.js"></script>
</body>
</html>
